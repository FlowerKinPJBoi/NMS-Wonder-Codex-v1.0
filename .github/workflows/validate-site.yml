name: Validate Wonder Codex Site

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API test dependencies
        run: python -m pip install -r api/requirements.txt pytest httpx

      - name: Run API tests
        working-directory: api
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q api/app

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -path './.git' -prune -o -name '*.js' -type f -print0)

      - name: Test Wonder Projector decoder vectors
        run: node tests/projector_decoder.test.js

      - name: Test public site invariants
        run: |
          node tests/site_invariants.test.js
          node tests/forge_builder.test.js
          node tests/expedition_gallery.test.js
          node tests/contribution_evidence.test.js
          node tests/feedback_questionnaire.test.js
          node tests/capture_passport.test.js
          node tests/editor_passport.test.js

  capture-passport-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: capture_passport_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/capture_passport_test
      CAPTURE_AUTH_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/capture_passport_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r api/requirements.txt pytest httpx
      - name: Apply migrations and exercise Passport sessions on PostgreSQL
        working-directory: api
        run: |
          alembic upgrade head
          python -m pytest -q tests/test_capture_passport.py
          python -m pytest -q tests/test_editor_imports.py
          python -c 'from app.database import check_database, state; assert check_database(), state.detail; assert state.revision == "0019_editor_imports"'
          alembic downgrade 0018_nms_profiles
          alembic upgrade head
          python -c 'from app.database import check_database, state; assert check_database(), state.detail'
          alembic downgrade 0016_pegasus_dispatches
          alembic upgrade head
