    <stop offset="0" stop-color="#DE8D39"/>
    <stop offset=".48" stop-color="#B22424"/>
    <stop offset="1" stop-color="#251C18"/>
  </radialGradient>
  <radialGradient id="shade-lava-standard" cx="34%" cy="28%" r="75%">
