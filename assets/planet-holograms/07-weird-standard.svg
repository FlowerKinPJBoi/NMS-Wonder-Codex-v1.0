<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Weird Standard representative hologram">
<defs>
  <radialGradient id="planet-weird-standard" cx="35%" cy="28%" r="78%">
    <stop offset="0" stop-color="#D267FF"/>
    <stop offset=".48" stop-color="#19A8B8"/>
    <stop offset="1" stop-color="#4F2A75"/>
  </radialGradient>
  <radialGradient id="shade-weird-standard" cx="34%" cy="28%" r="75%">
