<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
  <title>Unclassified planet representative archetype</title>
  <desc>A neutral planet hologram used until its VP1 family can be resolved.</desc>
  <defs>
    <radialGradient id="sky" cx="50%" cy="43%" r="72%"><stop stop-color="#17324b"/><stop offset=".62" stop-color="#0c1527"/><stop offset="1" stop-color="#050914"/></radialGradient>
    <radialGradient id="world" cx="35%" cy="28%" r="76%"><stop stop-color="#72eaff"/><stop offset=".35" stop-color="#25789a"/><stop offset=".72" stop-color="#193854"/><stop offset="1" stop-color="#08111f"/></radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#6de7ff" stroke-opacity=".07"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#sky)"/><rect width="1200" height="675" fill="url(#grid)"/>
  <g fill="none" stroke="#6de7ff"><circle cx="600" cy="337" r="250" stroke-opacity=".2"/><circle cx="600" cy="337" r="205" stroke-opacity=".32" stroke-dasharray="9 16"/><path d="M58 142V58h84M1058 58h84v84M58 533v84h84M1058 617h84v-84" stroke-width="3" stroke-opacity=".5"/></g>
  <g filter="url(#glow)">
    <circle cx="600" cy="337" r="154" fill="url(#world)" stroke="#6de7ff" stroke-width="7"/>
    <path d="M474 302c50-30 84-5 113 18 36 28 73 38 138-4M491 390c54-23 92-5 127 20 31 22 66 25 103 8" fill="none" stroke="#b9f6ff" stroke-opacity=".4" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g font-family="Inter,Arial,sans-serif" letter-spacing="4"><text x="58" y="42" font-size="17" fill="#dffbff">WONDER CODEX // PLANET FAMILY SCAN</text><text x="1142" y="42" font-size="14" text-anchor="end" fill="#6de7ff">NOT A SPECIMEN IMAGE</text><text x="58" y="645" font-size="19" fill="#9ceeff">UNCLASSIFIED PLANET</text></g>
</svg>
